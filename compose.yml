name: nikolai-calendar
services:
  calendar:
    build: .
    image: nikolai-calendar:1.4.1
    container_name: nikolai-calendar
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    environment:
      APP_ORIGIN: https://calendar.nikolai-server.lan
      DATA_DIR: /data
      AUTH_FILE: /run/secrets/calendar_auth
    volumes:
      - ./data:/data
    secrets:
      - calendar_auth
    networks:
      frontend:
        aliases: [nikolai-calendar]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "2m"
        max-file: "2"
secrets:
  calendar_auth:
    file: ./secrets/auth.json
networks:
  frontend:
    external: true
    name: home-server_frontend
