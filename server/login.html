<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Nikolai Calendar</title>
  <meta name="description" content="Sign in to Nikolai Calendar, your private year planner.">
  <link rel="stylesheet" href="/theme/tokens.css">
  <link rel="stylesheet" href="/theme/base.css">
  <link rel="stylesheet" href="/theme/login.css">
  <style>
    /* Hallmark · shape: app screen · genre: editorial · theme: Grid · redesign: full · v2.0.0 */
    /* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V4 · weakest: E, critical overflow guard survives delayed stylesheets */
    html, body { overflow-x: clip; }
  </style>
  <script src="/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-panel">
    <h1>Nikolai Calendar</h1>
    <p>Sign in to your year planner.</p>
    <form id="login" method="post" action="/api/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="remember">Stay signed in for 30 days on this device.</p>
      <button type="submit">Sign in</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
