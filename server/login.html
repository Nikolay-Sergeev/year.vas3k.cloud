<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Nikolai Calendar</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafafa; color: #243b2a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 380px; }
    h1 { margin: 0 0 10px; font-size: 30px; color: #222; }
    p { color: #5c655e; line-height: 1.5; }
    form { margin-top: 28px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 20px 0 8px; }
    input { width: 100%; padding: 12px; border: 1px solid #b8c4ba; border-radius: 6px; font: inherit; background: white; }
    input:focus-visible, button:focus-visible { outline: 3px solid #8ec9a3; outline-offset: 3px; }
    button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 6px; background: #28633d; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #error { color: #a22828; min-height: 24px; }
    .remember { font-size: 14px; }
  </style>
  <script src="/login.js" defer></script>
</head>
<body>
  <main>
    <h1>Nikolai Calendar</h1>
    <p>Sign in to your year planner.</p>
    <form id="login" method="post" action="/api/login">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p class="remember">Stay signed in for 30 days on this device.</p>
      <button type="submit">Sign in</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
